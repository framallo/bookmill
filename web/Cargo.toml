[package]
name = "bookmill-web"
version = "0.1.0"
edition = "2021"
description = "Standalone web UI (cover editor + previewer stub) for bookmill. v1."

[[bin]]
name = "bookmill-web"
path = "src/main.rs"

[dependencies]
# Shared cover-config resolver: the editor resolves the same values the build
# renders, instead of a hand-rolled partial merge that could drift (M8).
bookmill = { path = ".." }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
anyhow = "1"
