<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bookmill — books</title>
<style>
  :root { --bg:#11151c; --panel:#1b212b; --line:#2c3543; --ink:#e7edf3; --muted:#8a98a8; --accent:#d4a937; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .repo { color:var(--muted); font-size:12px; }
  .spacer { flex:1; }
  main { max-width:920px; margin:0 auto; padding:24px 20px 60px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  .card { display:block; text-decoration:none; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; transition:border-color .12s, transform .12s; }
  .card:hover { border-color:var(--accent); transform:translateY(-2px); }
  .card h2 { font-size:15px; margin:0 0 8px; line-height:1.3; }
  .card .slug { color:var(--muted); font-size:11px; font-family:ui-monospace,Menlo,monospace; word-break:break-all; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
  .tag { font-size:11px; padding:2px 8px; border-radius:10px; background:#222b36; color:var(--ink); border:1px solid var(--line); }
  .tag.prot { background:#3a2a12; color:var(--accent); border-color:#5a431c; }
  .muted { color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>bookmill</h1>
  <span class="repo" id="repo"></span>
  <span class="spacer"></span>
  <span class="muted" id="count"></span>
</header>
<main>
  <div class="grid" id="grid"></div>
  <p class="muted" id="empty" style="display:none">No books found.</p>
</main>
<script src="/home.js"></script>
</body>
</html>
