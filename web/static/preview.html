<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bookmill — interior previewer</title>
<link rel="stylesheet" href="/app.css" />
<script src="https://unpkg.com/konva@9/konva.min.js"></script>
<style>
  /* tokens + .appbar come from /app.css */
  header { flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; white-space:nowrap; }
  .spacer { flex:1; }
  select, button, input { background:#222b36; border:1px solid var(--line); border-radius:6px; padding:6px 9px; color:var(--ink); font:inherit; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  label.tog { display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:12px; cursor:pointer; }
  a.navlink { color:var(--muted); text-decoration:none; }
  /* segmented language toggle (matches the cover editor) */
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:0; border-radius:0; background:transparent; color:var(--muted); padding:6px 12px; font-size:13px; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--accent); color:#1a1206; font-weight:600; }
  .seg button:not(.on):hover { color:var(--ink); }
  /* full-wrap cover view */
  #stage .wrapview { display:block; box-shadow:0 8px 40px rgba(0,0,0,.55); }
  #stage .wrapview svg { display:block; }
  .loadingwrap { color:var(--muted); padding:60px; font-size:13px; }
  .layout { display:flex; min-height:calc(100vh - 52px); }
  .stagewrap { flex:1; display:flex; flex-direction:column; align-items:center; padding:20px; overflow:auto; }
  .navbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .navbar .pglabel { color:var(--muted); min-width:130px; text-align:center; }
  #stage { background:#0c0f14; box-shadow:0 8px 40px rgba(0,0,0,.55); }
  .legend { display:flex; gap:18px; margin-top:12px; color:var(--muted); font-size:12px; }
  .legend span::before { content:''; display:inline-block; width:14px; height:0; border-top:3px solid; margin-right:6px; vertical-align:middle; }
  .l-trim::before { border-color:#ffffff; }
  .l-bleed::before { border-color:#ff5a5a; }
  .l-safe::before { border-color:#56b6ff; border-top-style:dashed !important; }
  /* warnings dropdown (replaces the old side panel) */
  .results { position:absolute; right:14px; top:52px; z-index:15; width:360px; max-height:72vh; overflow:auto;
             background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px 14px;
             box-shadow:0 12px 34px rgba(0,0,0,.55); display:none; }
  .results.open { display:block; }
  .results .rhead { display:flex; align-items:center; justify-content:space-between; font-size:12px;
                    text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; }
  .results .rhead button { background:transparent; border:none; color:var(--muted); font-size:14px; cursor:pointer; padding:0 4px; }
  .results .rhead button:hover { color:var(--ink); }
  .counts { display:inline-flex; gap:6px; font-size:12px; cursor:pointer; }
  .pill { padding:2px 8px; border-radius:10px; background:#222b36; }
  .pill.ok { color:var(--ok); } .pill.warn { color:var(--warn); } .pill.err { color:var(--err); }
  .issue { border:1px solid var(--line); border-left-width:3px; border-radius:6px; padding:8px 10px; margin-bottom:8px; font-size:12.5px; }
  .issue.ok { border-left-color:var(--ok); }
  .issue.warn { border-left-color:var(--warn); }
  .issue.error { border-left-color:var(--err); }
  .issue .meta { color:var(--muted); font-size:11px; display:flex; gap:6px; margin-bottom:3px; }
  .issue .pgbtn { cursor:pointer; color:var(--accent); text-decoration:underline; }
  .muted { color:var(--muted); font-size:12px; }
  .err-msg { color:var(--err); font-size:12px; white-space:pre-wrap; }

  /* ---- keyboard-shortcuts help ---- */
  .helpbtn { position:fixed; right:16px; bottom:16px; z-index:20; width:34px; height:34px;
             border-radius:50%; border:1px solid var(--line); background:#222b36; color:var(--muted);
             font-size:16px; font-weight:700; cursor:pointer; }
  .helpbtn:hover { color:var(--accent); border-color:var(--accent); }
  .help-overlay { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
                  background:rgba(0,0,0,.55); }
  .help-overlay.open { display:flex; }
  .help-card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px 20px;
               min-width:320px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .help-card h3 { margin:0 0 12px; font-size:14px; }
  .help-card table { border-collapse:collapse; font-size:13px; }
  .help-card td { padding:3px 10px 3px 0; color:var(--ink); }
  .help-card kbd { display:inline-block; min-width:16px; text-align:center; padding:1px 6px; border-radius:5px;
                   background:#222b36; border:1px solid var(--line); font:12px ui-monospace,Menlo,monospace; }
  .help-card .hc-close { color:var(--muted); font-size:11px; margin-top:12px; }
</style>
</head>
<body>
<header class="appbar">
  <a class="navlink" href="/">← all books</a>
  <a class="navlink" id="backBook" href="#">← book</a>
  <h1>Preview</h1>
  <span id="bookLabel" class="muted"></span>
  <span class="seg" id="langSeg" title="Language"></span>
  <span style="width:8px"></span>
  <label class="tog"><input type="checkbox" id="tTrim" checked> trim</label>
  <label class="tog"><input type="checkbox" id="tBleed" checked> bleed</label>
  <label class="tog"><input type="checkbox" id="tSafe" checked> safe</label>
  <span class="spacer"></span>
  <button id="reload">↻ validate --deep</button>
  <span class="counts" id="counts"></span>
  <a class="navlink" id="toCover" href="#" style="margin-left:6px">edit cover →</a>
</header>

<!-- Warnings results — a dropdown from the header button (no side panel). -->
<div class="results" id="resultsPanel">
  <div class="rhead"><span>Warnings</span><button id="resClose" title="Close">✕</button></div>
  <div id="issues"></div>
</div>
<div class="layout">
  <div class="stagewrap">
    <div class="navbar">
      <button id="first">⏮</button>
      <button id="prev">◀ prev</button>
      <span class="pglabel" id="pglabel">—</span>
      <button id="next">next ▶</button>
      <button id="last">⏭</button>
      <span style="width:14px"></span>
      <span class="muted">page</span>
      <input id="jump" type="number" min="1" style="width:70px" />
      <button id="go">go</button>
    </div>
    <div id="stage"></div>
    <div class="legend">
      <span class="l-trim">trim</span>
      <span class="l-bleed">bleed</span>
      <span class="l-safe">safe</span>
    </div>
    <p class="muted" id="status" style="margin-top:10px"></p>
  </div>
</div>
<button class="helpbtn" id="helpBtn" title="Keyboard shortcuts (?)">?</button>
<div class="help-overlay" id="helpOverlay">
  <div class="help-card">
    <h3>Keyboard shortcuts</h3>
    <table>
      <tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>Previous / next spread</td></tr>
      <tr><td><kbd>Home</kbd> <kbd>End</kbd></td><td>First / last spread</td></tr>
      <tr><td><kbd>g</kbd></td><td>Focus page number</td></tr>
      <tr><td><kbd>t</kbd> <kbd>b</kbd> <kbd>s</kbd></td><td>Toggle trim / bleed / safe</td></tr>
      <tr><td><kbd>?</kbd></td><td>Toggle this help</td></tr>
    </table>
    <div class="hc-close">Press <kbd>Esc</kbd> or <kbd>?</kbd> to close</div>
  </div>
</div>
<script src="/preview.js"></script>
</body>
</html>
